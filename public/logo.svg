<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="KalpaDB — a graph of Indian-language script nodes linked to speculative-fiction symbols">
  <defs>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <style>
      .lang  { font-family: 'Noto Sans Bengali','Noto Sans Devanagari','Noto Sans Tamil','Noto Sans Telugu','Noto Sans',system-ui,sans-serif; font-weight: 700; }
      .latin { font-family: 'Noto Sans',system-ui,'Segoe UI',sans-serif; font-weight: 800; }
    </style>
  </defs>

  <!-- ── edges (drawn first, hidden under the opaque nodes) ───────────────── -->
  <g stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.75" fill="none">
    <!-- hub → language nodes -->
    <line x1="100" y1="100" x2="145.25" y2="54.75"/>
    <line x1="100" y1="100" x2="145.25" y2="145.25"/>
    <line x1="100" y1="100" x2="54.75"  y2="145.25"/>
    <line x1="100" y1="100" x2="54.75"  y2="54.75"/>
    <!-- languages → speculative-fiction symbols -->
    <line x1="145.25" y1="54.75"  x2="100" y2="36"/>
    <line x1="145.25" y1="54.75"  x2="164" y2="100"/>
    <line x1="145.25" y1="145.25" x2="164" y2="100"/>
    <line x1="145.25" y1="145.25" x2="100" y2="164"/>
    <line x1="54.75"  y1="145.25" x2="100" y2="164"/>
    <line x1="54.75"  y1="145.25" x2="36"  y2="100"/>
    <line x1="54.75"  y1="54.75"  x2="36"  y2="100"/>
    <line x1="54.75"  y1="54.75"  x2="100" y2="36"/>
  </g>

  <!-- ── speculative-fiction symbol nodes (cyan) ──────────────────────────── -->
  <g>
    <!-- ringed planet (top) -->
    <circle cx="100" cy="36" r="15" fill="#fff" stroke="#0891b2" stroke-width="2"/>
    <g transform="translate(100 36)" fill="none" stroke="#0891b2" stroke-width="2">
      <circle cx="0" cy="0" r="6"/>
      <ellipse cx="0" cy="0" rx="11" ry="3.6" transform="rotate(-22)"/>
    </g>

    <!-- rocket (right) -->
    <circle cx="164" cy="100" r="15" fill="#fff" stroke="#0891b2" stroke-width="2"/>
    <g transform="translate(164 100)" fill="none" stroke="#0891b2" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0,-11 C2.8,-6 3,0 2.6,7 L-2.6,7 C-3,0 -2.8,-6 0,-11 Z"/>
      <circle cx="0" cy="-3.5" r="2"/>
      <path d="M-2.6,3.5 L-6.5,8.5 L-2.6,7.5 Z"/>
      <path d="M2.6,3.5 L6.5,8.5 L2.6,7.5 Z"/>
      <path d="M-1.5,7.2 L0,11.5 L1.5,7.2"/>
    </g>

    <!-- sparkle star (bottom) -->
    <circle cx="100" cy="164" r="15" fill="#fff" stroke="#0891b2" stroke-width="2"/>
    <path transform="translate(100 164)" fill="#0891b2"
      d="M0,-10 C1.2,-3.5 3.5,-1.2 10,0 C3.5,1.2 1.2,3.5 0,10 C-1.2,3.5 -3.5,1.2 -10,0 C-3.5,-1.2 -1.2,-3.5 0,-10 Z"/>

    <!-- atom (left) -->
    <circle cx="36" cy="100" r="15" fill="#fff" stroke="#0891b2" stroke-width="2"/>
    <g transform="translate(36 100)" fill="none" stroke="#0891b2" stroke-width="1.6">
      <ellipse rx="10" ry="3.8"/>
      <ellipse rx="10" ry="3.8" transform="rotate(60)"/>
      <ellipse rx="10" ry="3.8" transform="rotate(120)"/>
      <circle cx="0" cy="0" r="2.1" fill="#0891b2"/>
    </g>
  </g>

  <!-- ── language script nodes (violet) ───────────────────────────────────── -->
  <g text-anchor="middle" dominant-baseline="central" fill="#6d28d9">
    <circle cx="145.25" cy="54.75" r="16" fill="#fff" stroke="#7c3aed" stroke-width="2.2"/>
    <text class="lang"  x="145.25" y="55.75" font-size="22">अ</text>

    <circle cx="145.25" cy="145.25" r="16" fill="#fff" stroke="#7c3aed" stroke-width="2.2"/>
    <text class="lang"  x="145.25" y="146.25" font-size="22">க</text>

    <circle cx="54.75" cy="145.25" r="16" fill="#fff" stroke="#7c3aed" stroke-width="2.2"/>
    <text class="lang"  x="54.75" y="146.25" font-size="22">క</text>

    <circle cx="54.75" cy="54.75" r="16" fill="#fff" stroke="#7c3aed" stroke-width="2.2"/>
    <text class="latin" x="54.75" y="55.75" font-size="21">K</text>
  </g>

  <!-- ── hub: Bengali "ka" (ক) ─────────────────────────────────────────────── -->
  <circle cx="100" cy="100" r="22" fill="url(#hub)"/>
  <text class="lang" x="100" y="101.5" font-size="27" text-anchor="middle" dominant-baseline="central" fill="#fff">ক</text>
</svg>
